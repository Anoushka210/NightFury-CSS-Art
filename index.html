<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toothless CSS Art</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">

    <!-- Ground Shadow -->
    <div class="shadow"></div>

    <!-- Toothless -->
    <div class="toothless">

        <!-- Tail -->
        <div class="tail">
            <div class="tail-fin left"></div>
            <div class="tail-fin right"></div>
        </div>

        <!-- Left Wing -->
        <div class="wing left">
            <div class="wing-inner"></div>
        </div>

        <!-- Right Wing -->
        <div class="wing right">
            <div class="wing-inner"></div>
        </div>

        <!-- Body -->
        <div class="body">

            <!-- Belly -->
            <div class="belly"></div>

            <!-- Arms -->
            <div class="arm left">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="arm right">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Feet -->
            <div class="foot left">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="foot right">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

        <!-- Head -->
        <div class="head">

            <!-- Ears -->
            <div class="ear left"></div>
            <div class="ear right"></div>

            <!-- Small Horns -->
            <div class="horn left"></div>
            <div class="horn right"></div>

            <!-- Eyes -->
            <div class="eye left">
                <div class="iris">
                    <div class="pupil"></div>
                    <div class="shine s1"></div>
                    <div class="shine s2"></div>
                </div>
            </div>

            <div class="eye right">
                <div class="iris">
                    <div class="pupil"></div>
                    <div class="shine s1"></div>
                    <div class="shine s2"></div>
                </div>
            </div>

            <!-- Nose -->
            <div class="nose">
                <span></span>
                <span></span>
            </div>

            <!-- Mouth -->
            <div class="mouth"></div>

        </div>

    </div>

</div>

</body>
</html>
